[custom.nightly-260327.web-server]
type = "local"
path = "server"
ipkg = "web-server.ipkg"

[custom.nightly-260327.web-client]
type = "local"
path = "client"
ipkg = "web-client.ipkg"

[custom.nightly-260327.shared-tests]
type = "local"
path = "t/shared"
ipkg = "shared-tests.ipkg"
