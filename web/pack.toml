[pack]
collection = "nightly-260327"

# Local sibling packages. Path is relative to this pack.toml (web/).
# `pack install-deps <ipkg>` resolves intra-repo deps through these entries.

[custom.nightly-260327.web-shared]
type = "local"
path = "shared"
ipkg = "web-shared.ipkg"

[custom.nightly-260327.content-build]
type = "local"
path = "content-build"
ipkg = "content-build.ipkg"

[custom.nightly-260327.web-server]
type = "local"
path = "server"
ipkg = "web-server.ipkg"

[custom.nightly-260327.web-client]
type = "local"
path = "client"
ipkg = "web-client.ipkg"

[custom.nightly-260327.shared-tests]
type = "local"
path = "t/shared"
ipkg = "shared-tests.ipkg"

# Local forks. Both pinned to the upstream commit referenced by
# nightly-260327 in pack-db, on the `local-patches` branch carrying our
# additions to HTMLTag / Text.HTML.Node (Nav, Main, Figure, Mark, Em,
# Strong, Code, ... — full HTML5 semantic + inline set). PR upstream
# eventually; keep the fork until then.

[custom.nightly-260327.css]
type = "local"
path = "vendor/idris2-css"
ipkg = "css.ipkg"

[custom.nightly-260327.dom-mvc]
type = "local"
path = "vendor/idris2-dom-mvc"
ipkg = "dom-mvc.ipkg"
